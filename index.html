<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>نصيب | Naseeb</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%230B0914'/%3E%3Cpath d='M28 60 Q28 90 64 90' stroke='%237C3AED' stroke-width='10' fill='none' stroke-linecap='round'/%3E%3Cpath d='M64 90 Q100 90 100 60 L100 52' stroke='%23A855F7' stroke-width='10' fill='none' stroke-linecap='round'/%3E%3Crect x='56' y='25' width='16' height='16' fill='%23A855F7' transform='rotate(45 64 33)'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: { colors: { primary: '#7C3AED', dark: '#0B0914', card: '#171524' } }
    }
  }
</script>
<style>
  body { font-family: 'Tajawal', sans-serif; transition: background-color 0.3s, color 0.3s; }
  .dark body { background-color: #0B0914; color: #FFFFFF; }
  body { background-color: #F3F4F6; color: #111827; }
  
  .card { background-color: #FFFFFF; border: 1px solid rgba(0,0,0,0.05); }
  .dark .card { background-color: #171524; border: 1px solid rgba(255,255,255,0.05); }
  
  .btn-primary { background: linear-gradient(135deg, #7C3AED, #A855F7); color: white; }
  .hidden { display: none !important; }
  
  input, select, textarea { background-color: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); color: #111827; }
  .dark input, .dark select, .dark textarea { background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; }
  
  .tab-active { color: #7C3AED; }
  .tab-active i { stroke: #7C3AED; }
  
  .msg-me { background: linear-gradient(135deg, #7C3AED, #6D28D9); border-radius: 16px 16px 4px 16px; color: white; }
  .msg-them { background-color: #E5E7EB; border-radius: 16px 16px 16px 4px; color: #111827; }
  .dark .msg-them { background-color: #2D2A3E; color: white; }
  
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="min-h-screen pb-20">

<!-- Splash Screen -->
<div id="splash" class="fixed inset-0 bg-[#0B0914] z-[100] flex flex-col items-center justify-center">
  <svg viewBox="0 0 128 128" class="w-20 h-20 spinner">
    <path d="M 28 60 Q 28 90 64 90" stroke="#7C3AED" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 64 90 Q 100 90 100 60 L 100 52" stroke="#A855F7" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="56" y="25" width="16" height="16" fill="#A855F7" transform="rotate(45 64 33)"/>
  </svg>
</div>

<!-- ==================== 1. LANDING PAGE ==================== -->
<div id="screen-landing" class="hidden min-h-screen flex flex-col p-6">
  <div class="flex-1 flex flex-col justify-center items-center text-center mt-10">
    <svg viewBox="0 0 128 128" class="w-20 h-20 mx-auto mb-6">
      <path d="M 28 60 Q 28 90 64 90" stroke="#7C3AED" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 64 90 Q 100 90 100 60 L 100 52" stroke="#A855F7" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="56" y="25" width="16" height="16" fill="#A855F7" transform="rotate(45 64 33)"/>
    </svg>
    <h1 class="text-4xl font-black mb-4 leading-tight">ابحث عن <span class="text-primary">نصيبك</span><br>بجدية واحترام</h1>
    <p class="text-gray-500 dark:text-gray-400 text-sm mb-10 px-4">منصة التعارف الراقية الأولى في الخليج واليمن والأردن.</p>
    
    <div class="grid grid-cols-2 gap-3 w-full max-w-sm mb-10">
      <div class="card p-4 rounded-2xl flex flex-col items-center text-center shadow-sm">
        <i data-lucide="shield-check" class="w-8 h-8 text-green-500 mb-2"></i>
        <span class="text-sm font-bold">خصوصية تامة</span>
      </div>
      <div class="card p-4 rounded-2xl flex flex-col items-center text-center shadow-sm">
        <i data-lucide="users" class="w-8 h-8 text-blue-500 mb-2"></i>
        <span class="text-sm font-bold">جديون فقط</span>
      </div>
    </div>
  </div>
  <div class="w-full space-y-3">
    <button onclick="showAuth('register')" class="btn-primary w-full py-4 rounded-2xl font-black text-lg shadow-lg">إنشاء حساب جديد</button>
    <button onclick="showAuth('login')" class="w-full py-4 rounded-2xl font-bold border border-gray-300 dark:border-white/10 hover:bg-gray-100 dark:hover:bg-white/5 transition">تسجيل الدخول</button>
  </div>
</div>

<!-- ==================== 2. AUTH SCREEN ==================== -->
<div id="screen-auth" class="hidden min-h-screen flex flex-col p-6 justify-center">
  <button onclick="showLanding()" class="absolute top-6 right-6 text-gray-500"><i data-lucide="arrow-right" class="w-6 h-6"></i></button>
  <div class="text-center mb-8">
    <h2 id="auth-title" class="text-3xl font-black mb-2">إنشاء حساب</h2>
  </div>
  <div id="auth-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 text-red-500 text-sm text-center border border-red-500/20"></div>
  
  <div class="space-y-4">
    <div id="auth-name-field"><input id="auth-name" type="text" placeholder="الاسم الكامل" class="w-full p-4 rounded-xl" /></div>
    <div id="auth-gender-field">
      <div class="flex gap-2">
        <button onclick="selectGender('male')" id="btn-male" class="flex-1 py-3 rounded-xl border border-gray-300 dark:border-white/10 text-gray-500 font-bold transition">رجل</button>
        <button onclick="selectGender('female')" id="btn-female" class="flex-1 py-3 rounded-xl border border-gray-300 dark:border-white/10 text-gray-500 font-bold transition">امرأة</button>
      </div>
    </div>
    <input id="auth-email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl" dir="ltr" />
    <input id="auth-password" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl" dir="ltr" />
    <button onclick="doAuth()" id="auth-submit" class="btn-primary w-full py-4 rounded-xl font-bold text-lg mt-4">تسجيل</button>
    <div class="text-center mt-4"><button onclick="toggleAuth()" class="text-gray-500 text-sm"><span id="auth-switch-text">لديك حساب؟ سجل الدخول</span></button></div>
  </div>
</div>

<!-- ==================== 3. MAIN APP ==================== -->
<div id="screen-main" class="hidden">
  <header class="flex justify-between items-center p-4 sticky top-0 bg-white/90 dark:bg-[#0B0914]/90 backdrop-blur-md z-40 border-b border-gray-200 dark:border-white/5">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center"><i data-lucide="heart" class="w-4 h-4 text-white"></i></div>
      <span class="font-black text-xl">نصيب</span>
    </div>
    <div class="flex items-center gap-3">
      <div id="vip-badge" class="hidden bg-yellow-500/20 text-yellow-600 dark:text-yellow-400 text-xs px-2 py-1 rounded-full font-bold border border-yellow-500/30">VIP</div>
      <button onclick="switchTab('settings')"><i data-lucide="settings" class="w-6 h-6 text-gray-500"></i></button>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto">
    <!-- TABS -->
    <div id="tab-search" class="tab-content">
      <h2 class="text-xl font-bold mb-4">الترشيحات</h2>
      <div id="search-grid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <div id="tab-matches" class="tab-content hidden">
      <h2 class="text-xl font-bold mb-4">الإعجابات المتبادلة</h2>
      <div id="matches-grid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- CHATS TAB (الرسائل) -->
    <div id="tab-chats" class="tab-content hidden">
      <h2 class="text-xl font-bold mb-4">الرسائل الخاصة</h2>
      <div id="chats-list" class="space-y-2"></div>
    </div>

    <!-- PROFILE -->
    <div id="tab-profile" class="tab-content hidden">
      <div class="flex flex-col items-center mb-6">
        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center text-4xl font-black mb-3 text-white shadow-lg" id="profile-avatar">؟</div>
        <h2 id="profile-name" class="text-2xl font-black">الاسم</h2>
        <p id="profile-type" class="text-gray-500 text-sm mt-1">حساب</p>
      </div>
      <div class="space-y-3">
        <button onclick="showVipModal()" class="w-full mt-4 btn-primary p-4 rounded-xl flex items-center justify-between shadow-lg">
          <div class="text-right"><div class="font-black">ترقية إلى VIP</div><div class="text-xs opacity-80 mt-1">فتح المراسلة المباشرة</div></div>
          <i data-lucide="crown" class="w-6 h-6"></i>
        </button>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="tab-settings" class="tab-content hidden">
      <div class="flex items-center gap-2 mb-6">
        <button onclick="switchTab('profile')" class="text-gray-500"><i data-lucide="arrow-right" class="w-5 h-5"></i></button>
        <h2 class="text-xl font-bold">الإعدادات</h2>
      </div>
      <div class="space-y-4">
        <div class="card rounded-xl p-4 flex justify-between items-center shadow-sm">
          <span class="font-bold text-sm">الوضع الداكن</span>
          <button onclick="toggleDarkMode()" id="dark-mode-btn" class="w-12 h-6 bg-primary rounded-full relative transition-colors"><div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform" style="transform: translateX(0)"></div></button>
        </div>
        <button onclick="logout()" class="w-full py-3 rounded-xl bg-red-500/10 text-red-500 font-bold text-sm">تسجيل الخروج</button>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV (4 TABS) -->
  <nav class="fixed bottom-0 left-0 w-full bg-white/95 dark:bg-[#0B0914]/95 backdrop-blur-lg border-t border-gray-200 dark:border-white/5 flex justify-around items-center py-3 z-40">
    <button onclick="switchTab('search')" data-tab="search" class="tab flex flex-col items-center gap-1 text-gray-400"><i data-lucide="compass" class="w-6 h-6"></i><span class="text-[10px] font-bold">الترشيحات</span></button>
    <button onclick="switchTab('matches')" data-tab="matches" class="tab flex flex-col items-center gap-1 text-gray-400"><i data-lucide="heart" class="w-6 h-6"></i><span class="text-[10px] font-bold">الإعجابات</span></button>
    <button onclick="switchTab('chats')" data-tab="chats" class="tab flex flex-col items-center gap-1 text-gray-400"><i data-lucide="message-circle" class="w-6 h-6"></i><span class="text-[10px] font-bold">الرسائل</span></button>
    <button onclick="switchTab('profile')" data-tab="profile" class="tab flex flex-col items-center gap-1 text-gray-400"><i data-lucide="user" class="w-6 h-6"></i><span class="text-[10px] font-bold">ملفي</span></button>
  </nav>
</div>

<!-- ==================== 4. CHAT VIEW (Overlay) ==================== -->
<div id="chat-view" class="hidden fixed inset-0 bg-white dark:bg-[#0B0914] z-50 flex flex-col">
  <header class="flex items-center gap-3 p-4 border-b border-gray-200 dark:border-white/10 bg-white dark:bg-[#0B0914]">
    <button onclick="closeChat()" class="text-gray-500"><i data-lucide="arrow-right" class="w-6 h-6"></i></button>
    <div class="font-bold" id="chat-header-name">اسم المستخدم</div>
  </header>
  <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 dark:bg-[#0B0914]"></div>
  <div class="p-3 border-t border-gray-200 dark:border-white/10 flex gap-2 bg-white dark:bg-[#0B0914]">
    <input id="chat-input" placeholder="اكتب رسالة..." class="flex-1 p-3 rounded-xl" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()" class="btn-primary w-12 h-12 rounded-xl flex items-center justify-center shadow-md"><i data-lucide="send" class="w-5 h-5"></i></button>
  </div>
</div>

<!-- VIP Modal -->
<div id="modal-vip" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
  <div class="card rounded-3xl p-6 w-full max-w-sm text-center relative shadow-2xl">
    <button onclick="hideVipModal()" class="absolute top-4 right-4 text-gray-400"><i data-lucide="x" class="w-6 h-6"></i></button>
    <i data-lucide="crown" class="w-16 h-16 text-yellow-500 mx-auto mb-4"></i>
    <h3 class="text-2xl font-black mb-2 text-yellow-500">عضوية VIP</h3>
    <p class="text-gray-500 text-sm mb-6">لبدء محادثة غير محدودة.</p>
    <button onclick="mockPayment()" class="btn-primary block w-full py-3 rounded-xl font-bold mb-3">شراء الآن (تجريبي)</button>
  </div>
</div>

<div id="toast" class="hidden fixed top-10 left-1/2 -translate-x-1/2 z-[60] px-6 py-3 rounded-full font-bold shadow-2xl text-sm"></div>

<script>
const SUPABASE_URL = 'https://hzxxemfxwndnswyphtxs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DpefXs6FlXf1WljxS87-XA_1Q27vbbd';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = { user: null, profile: null, isVip: false, selectedGender: null, activeChatId: null, chatChannel: null };
const $ = id => document.getElementById(id);
const initIcons = () => lucide.createIcons();

// Splash & Init
setTimeout(() => {
  $('splash').style.opacity = '0';
  setTimeout(() => $('splash').style.display = 'none', 500);
  sb.auth.getSession().then(({ data: { session } }) => {
    if(session) enterApp();
    else showLanding();
  });
}, 1000);

function showLanding() {
  ['screen-landing','screen-auth','screen-main'].forEach(s => $(s).classList.add('hidden'));
  $('screen-landing').classList.remove('hidden');
}

function showAuth(mode) {
  ['screen-landing','screen-auth','screen-main'].forEach(s => $(s).classList.add('hidden'));
  $('screen-auth').classList.remove('hidden');
  isRegister = (mode === 'register');
  updateAuthUI();
  initIcons();
}

let isRegister = true;
function toggleAuth() { isRegister = !isRegister; updateAuthUI(); }
function updateAuthUI() {
  $('auth-name-field').classList.toggle('hidden', !isRegister);
  $('auth-gender-field').classList.toggle('hidden', !isRegister);
  $('auth-title').textContent = isRegister ? 'إنشاء حساب' : 'تسجيل الدخول';
  $('auth-submit').textContent = isRegister ? 'تسجيل' : 'دخول';
  $('auth-switch-text').textContent = isRegister ? 'لديك حساب؟ سجل الدخول' : 'ليس لديك حساب؟ سجل الآن';
}

function selectGender(g) {
  state.selectedGender = g;
  $('btn-male').className = g === 'male' ? 'flex-1 py-3 rounded-xl border border-primary text-primary font-bold bg-primary/10 transition' : 'flex-1 py-3 rounded-xl border border-gray-300 dark:border-white/10 text-gray-500 font-bold transition';
  $('btn-female').className = g === 'female' ? 'flex-1 py-3 rounded-xl border border-primary text-primary font-bold bg-primary/10 transition' : 'flex-1 py-3 rounded-xl border border-gray-300 dark:border-white/10 text-gray-500 font-bold transition';
}

function toast(msg, isErr=false) {
  const t = $('toast'); t.textContent = msg;
  t.className = `fixed top-10 left-1/2 -translate-x-1/2 z-[60] px-6 py-3 rounded-full font-bold shadow-2xl text-sm ${isErr?'bg-red-500':'bg-green-500'} text-white`;
  setTimeout(() => t.classList.add('hidden'), 3000);
}

// Auth Logic
async function doAuth() {
  const email = $('auth-email').value;
  const pass = $('auth-password').value;
  $('auth-error').classList.add('hidden');
  
  if (isRegister) {
    const name = $('auth-name').value;
    if(!name || !state.selectedGender) return $('auth-error').textContent = 'أكمل جميع البيانات';
    
    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if (error) return $('auth-error').textContent = error.message;
    
    if (data.user) {
      await sb.from('profiles').insert({
        id: data.user.id, full_name: name, gender: state.selectedGender, country: 'SA', is_verified: true
      });
      
      const oppositeGender = state.selectedGender === 'male' ? 'female' : 'male';
      await sb.rpc('generate_dummy_profiles', { target_gender: oppositeGender });
      
      if (!data.session) await sb.auth.signInWithPassword({ email, password: pass });
    }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) return $('auth-error').textContent = error.message;
  }
  enterApp();
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

async function enterApp() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return showLanding();
  state.user = user;
  
  const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).single();
  state.profile = prof;
  state.isVip = prof?.is_vip || false;
  
  if (state.isVip) $('vip-badge').classList.remove('hidden');
  
  $('profile-avatar').textContent = prof?.full_name?.charAt(0) || '؟';
  $('profile-name').textContent = prof?.full_name || 'مستخدم';
  $('profile-type').textContent = prof?.gender === 'male' ? 'حساب رجل' : 'حساب امرأة';
  
  ['screen-landing','screen-auth','screen-main'].forEach(s => $(s).classList.add('hidden'));
  $('screen-main').classList.remove('hidden');
  
  switchTab('search');
  initIcons();
}

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  $(`tab-${name}`).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t => { t.classList.remove('tab-active'); t.classList.add('text-gray-400'); });
  const btn = document.querySelector(`.tab[data-tab="${name}"]`);
  if(btn) { btn.classList.add('tab-active'); btn.classList.remove('text-gray-400'); }
  
  if(name === 'search') loadProfiles();
  if(name === 'chats') loadChats();
  if(name === 'matches') loadMatches();
  initIcons();
  window.scrollTo(0,0);
}

// Load Profiles (Opposite Gender Only)
async function loadProfiles() {
  const grid = $('search-grid');
  grid.innerHTML = '<div class="col-span-2 text-center py-10"><i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto text-primary"></i></div>';
  initIcons();
  
  // تأكد من وجود بروفايل للمستخدم
  if(!state.profile || !state.profile.gender) {
      grid.innerHTML = '<div class="col-span-2 text-center text-red-500 mt-10 font-bold">خطأ في جلب بيانات حسابك. يرجى تسجيل الخروج وإعادة التسجيل.</div>';
      return;
  }

  const targetGender = state.profile.gender === 'male' ? 'female' : 'male';
  const { data, error } = await sb.from('profiles').select('*').eq('gender', targetGender).limit(20);
  
  if(error) {
      grid.innerHTML = `<div class="col-span-2 text-center text-red-500 mt-10 font-bold">خطأ في الاتصال: ${error.message}</div>`;
      return;
  }

  if(!data || data.length === 0) {
    grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 mt-10 font-bold">لا توجد ترشيحات حالياً. تأكد من تشغيل كود الـ SQL الخاص بتوليد الحسابات.</div>';
    return;
  }
  
  grid.innerHTML = data.map(p => `
    <div class="relative rounded-2xl overflow-hidden h-64 shadow-md border border-gray-200 dark:border-white/5 bg-gray-100 dark:bg-[#1E1B2E]">
      <img src="${p.avatar_url || 'https://i.pravatar.cc/300'}" class="w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
      <div class="absolute bottom-0 left-0 w-full p-3 text-white">
        <div class="font-bold text-sm flex items-center gap-1">${p.full_name} ${p.is_verified?'<i data-lucide="check-circle" class="w-3 h-3 text-blue-400"></i>':''}</div>
        <div class="text-[10px] text-gray-300 mb-2">${p.age || '—'} سنة • ${p.city || '—'}</div>
        <div class="flex gap-1">
          <button onclick="sendLike('${p.id}')" class="flex-1 py-1.5 rounded-lg btn-primary text-xs font-bold flex justify-center items-center gap-1"><i data-lucide="heart" class="w-3 h-3"></i> إعجاب</button>
          <button onclick="startChat('${p.id}', '${p.full_name}')" class="px-2 py-1.5 rounded-lg bg-white/20 hover:bg-white/30 backdrop-blur text-xs"><i data-lucide="message-circle" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>
  `).join('');
  initIcons();
}

async function sendLike(id) {
  const { error } = await sb.from('likes').insert({ liker_id: state.user.id, liked_id: id });
  if(error && error.code === '23505') return toast('لقد أرسلت إعجاباً مسبقاً', true);
  if(error) return toast('حدث خطأ', true);
  toast('تم إرسال الإعجاب');
}

async function loadMatches() {
  const grid = $('matches-grid');
  grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 mt-10">جاري التحميل...</div>';
  
  const { data: sent } = await sb.from('likes').select('liked_id').eq('liker_id', state.user.id);
  if(!sent || sent.length === 0) return grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 mt-10 font-bold">لا توجد إعجابات متبادلة بعد</div>';
  
  const ids = sent.map(s => s.liked_id);
  const { data: mutual } = await sb.from('likes').select('liker_id').eq('liked_id', state.user.id).in('liker_id', ids);
  
  if(!mutual || mutual.length === 0) return grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 mt-10 font-bold">لا توجد إعجابات متبادلة بعد</div>';
  
  const mutualIds = mutual.map(m => m.liker_id);
  const { data: profiles } = await sb.from('profiles').select('*').in('id', mutualIds);
  
  grid.innerHTML = profiles.map(p => `
    <div class="relative rounded-2xl overflow-hidden h-56 shadow-md border border-gray-200 dark:border-white/5 bg-gray-100 dark:bg-[#1E1B2E]">
       <img src="${p.avatar_url || 'https://i.pravatar.cc/300'}" class="w-full h-full object-cover" />
       <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
       <div class="absolute bottom-0 left-0 w-full p-3 text-white text-center">
         <div class="font-bold text-sm">${p.full_name}</div>
         <button onclick="startChat('${p.id}', '${p.full_name}')" class="mt-2 w-full py-1.5 rounded-lg btn-primary text-xs font-bold">مراسلة</button>
       </div>
    </div>
  `).join('');
  initIcons();
}

// Chat Logic
async function loadChats() {
  const list = $('chats-list');
  list.innerHTML = '<div class="text-center text-gray-500 py-10"><i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto text-primary"></i></div>';
  initIcons();
  
  const { data, error } = await sb.from('messages')
    .select('*')
    .or(`sender_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`)
    .order('created_at', { ascending: false });
    
  if(error || !data || data.length === 0) return list.innerHTML = '<div class="text-center text-gray-500 py-10 font-bold">لا توجد رسائل حالياً. ابدأ بمراسلة أحد الترشيحات!</div>';
  
  const chats = {};
  data.forEach(m => {
    const otherId = m.sender_id === state.user.id ? m.recipient_id : m.sender_id;
    if(!chats[otherId]) chats[otherId] = m;
  });
  
  const otherIds = Object.keys(chats);
  const { data: profiles } = await sb.from('profiles').select('id, full_name, avatar_url').in('id', otherIds);
  const pMap = {};
  profiles.forEach(p => pMap[p.id] = p);
  
  list.innerHTML = otherIds.map(id => `
    <div onclick="startChat('${id}', '${pMap[id]?.full_name}')" class="card p-4 rounded-xl flex items-center gap-3 cursor-pointer shadow-sm hover:bg-gray-50 dark:hover:bg-white/5 transition">
      <img src="${pMap[id]?.avatar_url || 'https://i.pravatar.cc/150'}" class="w-12 h-12 rounded-full object-cover" />
      <div class="flex-1 overflow-hidden">
        <div class="font-bold text-sm">${pMap[id]?.full_name || 'مستخدم'}</div>
        <div class="text-xs text-gray-500 truncate">${chats[id].content}</div>
      </div>
    </div>
  `).join('');
}

async function startChat(id, name) {
  state.activeChatId = id;
  $('chat-header-name').textContent = name;
  $('chat-view').classList.remove('hidden');
  $('chat-messages').innerHTML = '<div class="text-center text-gray-500 py-4 text-xs">جاري التحميل...</div>';
  
  await fetchMessages();
  
  if(state.chatChannel) sb.removeChannel(state.chatChannel);
  state.chatChannel = sb.channel('chat_room')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const msg = payload.new;
      if((msg.sender_id === state.user.id && msg.recipient_id === state.activeChatId) || 
         (msg.sender_id === state.activeChatId && msg.recipient_id === state.user.id)) {
        appendMessage(msg);
      }
    }).subscribe();
}

async function fetchMessages() {
  const { data } = await sb.from('messages')
    .select('*')
    .or(`and(sender_id.eq.${state.user.id},recipient_id.eq.${state.activeChatId}),and(sender_id.eq.${state.activeChatId},recipient_id.eq.${state.user.id})`)
    .order('created_at');
  
  $('chat-messages').innerHTML = '';
  if(data) data.forEach(appendMessage);
}

function appendMessage(m) {
  const isMe = m.sender_id === state.user.id;
  const div = document.createElement('div');
  div.className = `flex ${isMe ? 'justify-start' : 'justify-end'} mb-2`;
  div.innerHTML = `
    <div class="max-w-[75%] px-4 py-2 text-sm ${isMe ? 'msg-me' : 'msg-them'} shadow-sm">
      ${m.content}
    </div>
  `;
  $('chat-messages').appendChild(div);
  $('chat-messages').scrollTop = $('chat-messages').scrollHeight;
}

async function sendMessage() {
  const text = $('chat-input').value.trim();
  if(!text || !state.activeChatId) return;
  $('chat-input').value = '';
  
  await sb.from('messages').insert({ sender_id: state.user.id, recipient_id: state.activeChatId, content: text });
}

function closeChat() {
  $('chat-view').classList.add('hidden');
  state.activeChatId = null;
  if(state.chatChannel) sb.removeChannel(state.chatChannel);
  loadChats();
}

// Settings & UI
function toggleDarkMode() {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  const btn = $('dark-mode-btn');
  if(isDark) {
    btn.style.backgroundColor = '#7C3AED';
    btn.querySelector('div').style.transform = 'translateX(0)';
  } else {
    btn.style.backgroundColor = '#ccc';
    btn.querySelector('div').style.transform = 'translateX(-24px)';
  }
}

function showVipModal() { $('modal-vip').classList.remove('hidden'); initIcons(); }
function hideVipModal() { $('modal-vip').classList.add('hidden'); }
async function mockPayment() {
  const { error } = await sb.from('profiles').update({ is_vip: true }).eq('id', state.user.id);
  if(!error) {
    state.isVip = true;
    $('vip-badge').classList.remove('hidden');
    hideVipModal();
    toast('تم تفعيل VIP بنجاح!');
  }
}

// Start
initIcons();
</script>
